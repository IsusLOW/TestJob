services:
  app:
    build:
      context: ./Api
    volumes:
      - ./Api:/src
      - nuget-cache:/nuget-cache:rw
    ports:
      - "8090:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      NUGET_PACKAGES: /nuget-cache
      DOTNET_NOLOGO: "1"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=testjob;Username=postgres
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: testjob
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # Состояние БД сохраняется при перезапуске проекта.
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testjob"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: testjob
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: "80"
      # http://localhost:8080/?key=testjob-desktop-key 
      PGADMIN_INT_KEY: testjob-desktop-key
    volumes:
      # Подключение к БД.
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  nuget-cache:
